name: Sejong Notice Checker

on:
  schedule:
    - cron: '17 4 * * *'  # 매일 오후 1시 17분 KST (production) — 정각은 부하가 몰려 지연·누락이 잦아 피한다
    - cron: '17 9 * * *'  # 매일 오후 6시 17분 KST (production)
  push:
    branches:
      - test
  workflow_dispatch:
    inputs:
      test:
        description: 'Slack 연결 테스트만 실행'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check notices
        env:
          SLACK_WEBHOOK_URL: ${{ github.ref == 'refs/heads/test' && secrets.SLACK_WEBHOOK_URL_TEST || secrets.SLACK_WEBHOOK_URL }}
        run: python main.py ${{ inputs.test && '--test' || '' }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: update notice state [skip ci]"
          git push
